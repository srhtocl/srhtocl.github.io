name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# GitHub Pages'e yazma izni
permissions:
  contents: write

jobs:
  deploy:
    name: Lint, Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Kodu çek
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js kur
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Bağımlılıkları yükle (package-lock.json'a sadık kal)
      - name: 📦 Install Dependencies
        run: npm ci

      # 4. Lint kontrolü
      - name: 🔍 Run Lint
        run: npm run lint

      # 5. Production build (env secret'larını enjekte et)
      - name: 🏗️ Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_ADMIN_UID: ${{ secrets.VITE_ADMIN_UID }}

      # 6. Deploy (sadece main branch'e push'ta çalışır, PR'da çalışmaz)
      - name: 🌐 Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
